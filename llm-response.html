<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenCluely</title>
    <script src="lib/markdown.js"></script>
    <script src="lib/mathrender.js"></script>
    <!-- Syntax highlighting (local, no network). manual:true so Prism does not
         auto-highlight on load and fight our explicit render calls. -->
    <script>window.Prism = window.Prism || {}; window.Prism.manual = true;</script>
    <script src="lib/prism/prism-core.js"></script>
    <script src="lib/prism/prism-c.js"></script>
    <script src="lib/prism/prism-cpp.js"></script>
    <script src="lib/prism/prism-java.js"></script>
    <script src="lib/prism/prism-javascript.js"></script>
    <script src="lib/prism/prism-python.js"></script>
    <style>
        .text-white { color: white; }
        .text-gray-300 { color: #d1d5db; }
        .text-sm { font-size: 0.875rem; }
        .font-medium { font-weight: 500; }
        .mr-2 { margin-right: 0.5rem; }

        body {
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.4) 0%, rgba(20, 20, 20, 0.5) 100%);;
            -webkit-app-region: no-drag;
            color: white;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        .content-area {
            -webkit-app-region: no-drag;
        }
        .markdown-content {
            line-height: 1.6;
            color: white;
            font-size: 0.875rem;
        }
        .markdown-content h1, .markdown-content h2, .markdown-content h3 {
            margin-top: 1.2rem;
            margin-bottom: 0.8rem;
            font-weight: bold;
            color: white;
        }
        .markdown-content h1 { font-size: 1.2rem; }
        .markdown-content h2 { font-size: 1.1rem; }
        .markdown-content h3 { font-size: 1rem; }
        .markdown-content p { margin-bottom: 0.8rem; color: white; font-size: 0.875rem; }
        .markdown-content ul, .markdown-content ol { margin-bottom: 0.8rem; padding-left: 1.2rem; font-size: 0.875rem; }
        .markdown-content li { margin-bottom: 0.4rem; color: white; font-size: 0.875rem; }
        .markdown-content code { 
            background-color: rgba(0, 0, 0, 0.4); 
            padding: 0.2rem 0.4rem; 
            border-radius: 0.25rem; 
            font-family: 'Courier New', monospace;
            color: #e5e7eb;
        }
        .markdown-content pre { 
            background-color: rgba(0, 0, 0, 0.4); 
            padding: 1rem; 
            border-radius: 0.5rem; 
            margin: 1rem 0;
            overflow-x: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .markdown-content pre code { 
            background-color: transparent; 
            padding: 0; 
            color: #e5e7eb;
        }
        .markdown-content blockquote {
            border-left: 4px solid #6b7280;
            padding-left: 1rem;
            margin: 1rem 0;
            font-style: italic;
            color: #d1d5db;
        }
        .math {
            font-family: 'Cambria Math', 'STIX Two Math', 'Latin Modern Math', Georgia, serif;
            white-space: nowrap;
        }
        .markdown-content sup, .markdown-content sub {
            font-size: 0.72em;
            line-height: 0;
        }

        /* Main container - ensures full viewport usage */
        .main-container {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
            background: transparent;
        }

        /* Split layout improvements */
        .split-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            height: 100vh;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* Panel improvements with proper scrolling */
        .text-panel, .code-panel {
            background: transparent;
            overflow: hidden;
            position: relative;
            min-height: 0; /* Important for grid items */
        }

        .panel-content {
            height: 100%;
            overflow-y: auto;
            overflow-x: auto;
            padding: 1rem;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        /* Full content layout */
        .full-content {
            height: 100vh;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
            position: relative;
        }

        .full-content-inner {
            height: 100%;
            background-color: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow-y: auto;
            overflow-x: auto;
            padding: 1rem;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        /* Hide scrollbars completely while maintaining scrollability */
        .panel-content::-webkit-scrollbar, 
        .full-content-inner::-webkit-scrollbar {
            width: 0px;
            height: 0px;
            display: none;
        }
        
        /* For Firefox and other browsers */
        .panel-content, 
        .full-content-inner {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        /* Code block styling */
        .code-block {
            background-color: rgba(0, 0, 0, 0.3); 
            margin-bottom: 1rem;
            border-radius: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .code-header {
            background-color: rgba(0, 0, 0, 0.4);
            padding: 0.5rem 0.75rem;
            border-radius: 0.5rem 0.5rem 0 0;
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            color: #d1d5db;
            font-weight: bold;
        }
        .code-content {
            padding: 1rem;
            overflow-x: auto;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 0 0 0.5rem 0.5rem;
        }
        .code-content pre {
            background-color: transparent;
            border: none;
            margin: 0;
            padding: 0;
            white-space: pre;
            tab-size: 4;
            -moz-tab-size: 4;
        }
        .code-content code {
            background-color: transparent;
            color: #e5e7eb;
            font-family: 'Courier New', ui-monospace, monospace;
            font-size: 0.9rem;
            line-height: 1.5;
        }
        .markdown-content pre {
            tab-size: 4;
            -moz-tab-size: 4;
        }
        .markdown-content pre code {
            font-size: 0.9rem;
            line-height: 1.5;
        }
        /* Code-only view: fills the panel, scrolls internally, keeps real structure */
        .code-only-pre {
            background-color: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.5rem;
            margin: 0 0 0.75rem 0;
            padding: 0.9rem 1rem;
            overflow-x: auto;
            white-space: pre;
            tab-size: 4;
            -moz-tab-size: 4;
        }
        .code-only-pre code {
            background: transparent;
            padding: 0;
            color: #e5e7eb;
            font-family: 'Courier New', ui-monospace, monospace;
            font-size: 0.9rem;
            line-height: 1.55;
            white-space: pre;
        }
        .code-only-pre:last-child {
            margin-bottom: 0;
        }

        /* Bare answers (MCQ, fill-in-the-blank, numeric) are short - make them
           readable at a glance instead of body-text size. */
        .answer-only {
            font-size: 1.35rem;
            line-height: 1.5;
            font-weight: 600;
            color: #ffffff;
            padding: 0.25rem 0;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* Prism token colors, scoped so they never restyle the panel itself */
        .code-only-pre .token.comment,
        .code-only-pre .token.prolog,
        .code-only-pre .token.doctype,
        .code-only-pre .token.cdata { color: #7c8794; }
        .code-only-pre .token.punctuation { color: #c9d1d9; }
        .code-only-pre .token.property,
        .code-only-pre .token.tag,
        .code-only-pre .token.constant,
        .code-only-pre .token.symbol,
        .code-only-pre .token.deleted { color: #f47067; }
        .code-only-pre .token.boolean,
        .code-only-pre .token.number { color: #d2a8ff; }
        .code-only-pre .token.selector,
        .code-only-pre .token.attr-name,
        .code-only-pre .token.string,
        .code-only-pre .token.char,
        .code-only-pre .token.builtin,
        .code-only-pre .token.inserted { color: #96d0ff; }
        .code-only-pre .token.operator,
        .code-only-pre .token.entity,
        .code-only-pre .token.url { color: #ffab70; }
        .code-only-pre .token.atrule,
        .code-only-pre .token.attr-value,
        .code-only-pre .token.keyword { color: #f69d50; }
        .code-only-pre .token.function,
        .code-only-pre .token.class-name { color: #dcbdfb; }
        .code-only-pre .token.regex,
        .code-only-pre .token.important,
        .code-only-pre .token.variable { color: #ffab70; }

        .no-code {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #9ca3af;
            font-style: italic;
        }

        /* Loading state */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
        }
        
        .loading-compact {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 200px;
            height: 60px;
            background: transparent;
        }
        
        .dots-container {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }
        
        .bouncing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #4CAF50;
            animation: bounce 1.4s infinite ease-in-out;
        }
        
        .bouncing-dot:nth-child(1) { animation-delay: -0.32s; }
        .bouncing-dot:nth-child(2) { animation-delay: -0.16s; }
        .bouncing-dot:nth-child(3) { animation-delay: 0s; }
        
        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0);
                opacity: 0.5;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Interactive scrolling enhancements */
        .interactive-scrolling .panel-content,
        .interactive-scrolling .full-content-inner {
            cursor: grab;
        }

        .interactive-scrolling .panel-content:active,
        .interactive-scrolling .full-content-inner:active {
            cursor: grabbing;
        }

        /* Remove hover effects for clean content appearance */

        /* Override Prism theme for better visibility */
        .token.comment,
        .token.prolog,
        .token.doctype,
        .token.cdata {
            color: #6a737d;
        }
        
        .token.punctuation {
            color: #e1e4e8;
        }
        
        .token.property,
        .token.tag,
        .token.boolean,
        .token.number,
        .token.constant,
        .token.symbol,
        .token.deleted {
            color: #79b8ff;
        }
        
        .token.selector,
        .token.attr-name,
        .token.string,
        .token.char,
        .token.builtin,
        .token.inserted {
            color: #85e89d;
        }
        
        .token.operator,
        .token.entity,
        .token.url,
        .language-css .token.string,
        .style .token.string {
            color: #f97583;
        }
        
        .token.atrule,
        .token.attr-value,
        .token.keyword {
            color: #f97583;
        }
        
        .token.function,
        .token.class-name {
            color: #b392f0;
        }
        
        .token.regex,
        .token.important,
        .token.variable {
            color: #ffab70;
        }
        
        .token.important,
        .token.bold {
            font-weight: bold;
        }
        
        .token.italic {
            font-style: italic;
        }
        
        .token.entity {
            cursor: help;
        }

        /* Ensure content is always visible */
        .hidden { display: none !important; }
        .visible { display: block !important; }

        /* Draggable header bar */
        .window-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 32px;
            -webkit-app-region: drag;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            box-sizing: border-box;
            background: linear-gradient(180deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.04) 100%);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.12);
            z-index: 50;
            color: #e5e7eb;
            font-size: 12px;
            letter-spacing: 0.3px;
        }
        .window-title {
            pointer-events: none;
            user-select: none;
            opacity: 0.9;
        }
        .window-controls {
            display: flex;
            gap: 6px;
            -webkit-app-region: no-drag;
        }
        .window-btn {
            width: 22px;
            height: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            background: rgba(255,255,255,0.06);
            color: #e5e7eb;
            border: 1px solid rgba(255,255,255,0.12);
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
            font-weight: 600;
            line-height: 1;
        }
        .window-btn:hover {
            background: rgba(255,255,255,0.12);
            border-color: rgba(255,255,255,0.2);
        }
        .window-btn-close:hover {
            background: rgba(239, 68, 68, 0.25);
            border-color: rgba(239, 68, 68, 0.45);
            color: #fff;
        }
        
        /* Push content below header */
        .has-header #response-content,
        .has-header #loading {
            margin-top: 32px;
        }
        .has-header .split-layout,
        .has-header .full-content,
        .has-header .loading {
            height: calc(100vh - 32px);
        }

        .copy-btn { 
            position: absolute; 
            top: 6px; 
            right: 6px; 
            background: rgba(0,0,0,0.5); 
            color: rgba(255,255,255,0.9); 
            border: 1px solid rgba(255,255,255,0.2); 
            padding: 4px 8px; 
            font-size: 11px; 
            border-radius: 4px; 
            cursor: pointer; 
            -webkit-app-region: no-drag; 
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.12s ease;
        }
        .copy-btn:hover { background: rgba(0,0,0,0.7); }
        .copy-btn.copied { 
            background: rgba(76,175,80,0.85); 
            border-color: rgba(76,175,80,0.95); 
            transform: scale(0.98);
        }
    </style>
</head>
<body class="text-white">
    <div class="main-container has-header">
        <!-- Draggable Header -->
        <div class="window-header">
            <div class="window-title">AI Response</div>
            <div class="window-controls">
                <button id="close-window-btn" class="window-btn window-btn-close" title="Close">×</button>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loading" class="loading">
            <div class="loading-compact">
                <span class="text-gray-300 text-sm font-medium mr-2">Analyzing</span>
                <div class="dots-container">
                    <div class="bouncing-dot"></div>
                    <div class="bouncing-dot"></div>
                    <div class="bouncing-dot"></div>
                </div>
            </div>
        </div>

        <!-- Response Content -->
        <div id="response-content" class="content-area hidden">
            <!-- Split Layout -->
            <div id="split-layout" class="split-layout hidden">
                <!-- Text Panel -->
                <div class="text-panel">
                    <div class="panel-content" tabindex="0">
                        <div id="text-content" class="markdown-content"></div>
                    </div>
                </div>

                <!-- Code Panel -->
                <div class="code-panel">
                    <div class="panel-content" tabindex="0">
                        <div id="code-content"></div>
                    </div>
                </div>
            </div>

            <!-- Full Content (when no code detected) -->
            <div id="full-content" class="full-content hidden">
                <div class="full-content-inner" tabindex="0">
                    <div id="full-markdown" class="markdown-content"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global variables
        let currentLayout = 'split';
        let hasCode = false;
        let isCodeOnly = false;
        let currentSkill = 'dsa';
        let isInteractive = false;
        let scrollableElements = [];
        let initialized = false;
        
        // Immediate logging to verify script execution
        console.log('[LLM-RESPONSE] Script tag executed');
        
        window.onerror = function(msg, url, line, col, error) {
            console.error('[LLM-RESPONSE] Window error:', msg, 'at line', line);
            return false;
        };
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('[LLM-RESPONSE] DOMContentLoaded fired');
            initLLMResponseWindow();
        });
        
        // Also try immediate init in case DOMContentLoaded already fired
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            console.log('[LLM-RESPONSE] Document already ready, initializing now');
            setTimeout(initLLMResponseWindow, 0);
        }
        
        function initLLMResponseWindow() {
            if (initialized) return;
            initialized = true;
            
            console.log('[LLM-RESPONSE] Initializing window...');

            // Prefer marked when available, but fall back to the bundled markdown.js parser.
            if (typeof marked !== 'undefined') {
                marked.setOptions({
                    highlight: function(code, lang) {
                        if (typeof Prism !== 'undefined' && Prism.languages[lang]) {
                            return Prism.highlight(code, Prism.languages[lang], lang);
                        }
                        return code;
                    },
                    breaks: true,
                    gfm: true
                });
                console.log('[LLM-RESPONSE] marked configured');
            } else if (typeof markdown !== 'undefined' && typeof markdown.toHTML === 'function') {
                console.log('[LLM-RESPONSE] using bundled markdown.js renderer');
            } else {
                console.error('[LLM-RESPONSE] no markdown renderer available, falling back to plain text');
            }

            console.log('[LLM-RESPONSE] electronAPI exists:', !!window.electronAPI);
            console.log('[LLM-RESPONSE] onDisplayLlmResponse method:', typeof window.electronAPI?.onDisplayLlmResponse);
            
            // Set up event listeners using electronAPI from preload script
            if (window.electronAPI) {
                console.log('[LLM-RESPONSE] Setting up IPC listeners...');
                
                // Set up show-loading event listener
                window.electronAPI.onShowLoading(() => {
                    console.log('[LLM-RESPONSE] show-loading received');
                    showLoadingState();
                });
                
                // Listen for LLM response
                window.electronAPI.onDisplayLlmResponse(function() {
                    console.log('[LLM-RESPONSE] ===== display-llm-response received! =====');
                    console.log('[LLM-RESPONSE] arguments count:', arguments.length);
                    
                    try {
                        // Get the data - could be first or second argument
                        let actualData = null;
                        if (arguments.length >= 2 && arguments[1] && typeof arguments[1] === 'object') {
                            actualData = arguments[1];
                        } else if (arguments.length >= 1 && arguments[0] && typeof arguments[0] === 'object') {
                            actualData = arguments[0];
                        }
                        
                        console.log('[LLM-RESPONSE] actualData keys:', actualData ? Object.keys(actualData) : 'null');
                        
                        const response = actualData?.content || actualData?.response;
                        console.log('[LLM-RESPONSE] response found:', !!response, 'length:', response?.length);
                        
                        if (!response) {
                            console.error('[LLM-RESPONSE] No response content found!');
                            hideLoadingState();
                            return;
                        }
                        
                        hideLoadingState();
                        displayResponse(actualData);
                        setupScrolling();
                        setTimeout(verifyDisplayState, 500);
                        console.log('[LLM-RESPONSE] Handler completed successfully');
                    } catch (err) {
                        console.error('[LLM-RESPONSE] Error in handler:', err.message, err.stack);
                        hideLoadingState();
                    }
                });
                
                console.log('[LLM-RESPONSE] IPC listeners set up successfully');
            } else {
                console.error('[LLM-RESPONSE] electronAPI not available!');
            }
        } // end initLLMResponseWindow

        function showLoadingState() {
            const loadingElement = document.getElementById('loading');
            const responseElement = document.getElementById('response-content');
            
            if (loadingElement) {
                loadingElement.classList.remove('hidden');
                loadingElement.style.display = ''; // Remove any forced display styles
            }
            
            if (responseElement) {
                responseElement.classList.add('hidden');
            }
            
            console.log('Loading state shown - should see Analyzing...');
        }

        function hideLoadingState() {
            const loadingElement = document.getElementById('loading');
            if (loadingElement) {
                loadingElement.classList.add('hidden');
                loadingElement.style.display = 'none'; // Force hide
                console.log('Loading state hidden');
            } else {
                console.error('Loading element not found!');
            }
        }

        function renderMarkdown(text) {
            if (typeof marked !== 'undefined') {
                return marked.parse ? marked.parse(text) : marked(text);
            }

            if (typeof markdown !== 'undefined' && typeof markdown.toHTML === 'function') {
                return markdown.toHTML(text);
            }

            return escapeHtml(text).replace(/\n/g, '<br>');
        }

        function calculateContentMetrics(response, codeBlocks) {
            // Count lines in the response
            const lines = response.split('\n');
            const lineCount = lines.length;

            // Check for long lines (over 80 characters)
            const hasLongLines = lines.some(line => line.length > 80);

            // Line-length stats (used to size the window so code fits without scrolling)
            const lineLengths = lines.map(l => l.length);
            const maxLineLength = lineLengths.length ? Math.max(...lineLengths) : 80;
            const avgLineLength = lineLengths.length
                ? Math.round(lineLengths.reduce((a, b) => a + b, 0) / lineLengths.length)
                : 80;

            // Count code blocks
            const codeBlockCount = codeBlocks.length;

            // Longest single line across all code blocks
            let maxCodeLineLength = 0;
            codeBlocks.forEach(b => {
                (b.code || '').split('\n').forEach(l => {
                    if (l.length > maxCodeLineLength) maxCodeLineLength = l.length;
                });
            });

            // Estimate content complexity
            const hasCode = codeBlockCount > 0;
            const isLongContent = lineCount > 30;
            const hasMultipleCodeBlocks = codeBlockCount > 2;

            return {
                lineCount,
                hasLongLines,
                avgLineLength,
                maxLineLength,
                maxCodeLineLength,
                codeBlocks: codeBlockCount,
                hasCode,
                isLongContent,
                hasMultipleCodeBlocks,
                complexity: isLongContent || hasMultipleCodeBlocks ? 'high' : hasCode ? 'medium' : 'low'
            };
        }

        function displayResponse(data) {
            // Show content
            const responseElement = document.getElementById('response-content');
            
            if (responseElement) {
                responseElement.classList.remove('hidden');
            }

            // Parse the response - check both content and response properties for compatibility
            const response = data.content || data.response;
            
            if (!response) {
                console.error('No response data received', {
                    dataKeys: Object.keys(data),
                    hasContent: !!data.content,
                    hasResponse: !!data.response
                });
                return;
            }
            
            // Check if response contains code blocks
            const codeBlocks = extractCodeBlocks(response);
            hasCode = codeBlocks.length > 0;

            // Calculate content metrics for dynamic sizing
            const contentMetrics = calculateContentMetrics(response, codeBlocks);

            // Determine how much non-code prose remains once code blocks are removed
            let proseOnly = response;
            codeBlocks.forEach(block => {
                proseOnly = proseOnly.replace(block.fullMatch, '');
            });
            proseOnly = proseOnly.replace(/\s+/g, '').trim();
            const codeOnly = hasCode && proseOnly.length === 0;

            isCodeOnly = codeOnly;

            if (codeOnly) {
                // Code-only response (e.g. DSA skill): single full-width panel,
                // rendered directly as <pre><code> without going through markdown.
                displayCodeOnlyLayout(codeBlocks);
            } else if (hasCode) {
                // Split layout: text on left, code on right
                displaySplitLayout(response, codeBlocks);
            } else if (response.trim().length <= 300 && response.split('\n').length <= 6) {
                // Bare answer (MCQ / fill-in-the-blank / numeric / one-liner)
                displayAnswerOnlyLayout(response.trim());
            } else {
                // Full layout: all content in one panel
                displayFullLayout(response);
            }
        }

        // Short, direct answers get their own large-text treatment.
        function displayAnswerOnlyLayout(answer) {
            document.getElementById('split-layout').classList.add('hidden');
            document.getElementById('full-content').classList.remove('hidden');

            const container = document.getElementById('full-markdown');
            container.innerHTML = '';

            const div = document.createElement('div');
            div.className = 'answer-only';
            div.textContent = answer;
            container.appendChild(div);

            const btn = document.createElement('button');
            btn.className = 'copy-btn';
            btn.textContent = 'Copy';
            attachCopy(btn, answer);
            container.style.position = 'relative';
            container.appendChild(btn);
        }

        // Render code blocks straight into the full-width panel as real <pre><code>,
        // bypassing the markdown renderer entirely so structure can never be lost.
        function displayCodeOnlyLayout(codeBlocks) {
            document.getElementById('split-layout').classList.add('hidden');
            document.getElementById('full-content').classList.remove('hidden');

            const container = document.getElementById('full-markdown');
            container.innerHTML = '';

            const langAlias = { 'c++': 'cpp', 'py': 'python', 'js': 'javascript', 'ts': 'javascript', 'text': 'clike' };

            codeBlocks.forEach(block => {
                const raw = (block.language || 'text').toLowerCase();
                const lang = langAlias[raw] || raw;

                const pre = document.createElement('pre');
                pre.className = 'code-only-pre';
                const codeEl = document.createElement('code');
                codeEl.className = 'language-' + lang;
                codeEl.textContent = block.code;
                pre.appendChild(codeEl);

                const btn = document.createElement('button');
                btn.className = 'copy-btn';
                btn.textContent = 'Copy';
                attachCopy(btn, block.code || '');
                pre.style.position = 'relative';
                pre.appendChild(btn);

                container.appendChild(pre);

                if (typeof Prism !== 'undefined' && Prism.languages && Prism.highlightElement) {
                    const grammar = Prism.languages[lang];
                    if (grammar) {
                        try { Prism.highlightElement(codeEl); } catch (e) { console.warn('Prism highlight failed', e); }
                    }
                }
            });
        }

        function setupScrolling() {
            // Set up scrollable elements based on current layout
            setTimeout(() => {
                if (isCodeOnly) {
                    scrollableElements = [
                        document.querySelector('.full-content-inner')
                    ].filter(el => el !== null);
                } else if (hasCode) {
                    scrollableElements = [
                        document.querySelector('.text-panel .panel-content'),
                        document.querySelector('.code-panel .panel-content')
                    ].filter(el => el !== null);
                } else {
                    scrollableElements = [
                        document.querySelector('.full-content-inner')
                    ].filter(el => el !== null);
                }
                // Reset scroll positions and ensure elements are focusable
                scrollableElements.forEach(element => {
                    element.scrollTop = 0;
                    element.scrollLeft = 0;
                    element.setAttribute('tabindex', '0');
                });

                // Enable scrolling if interactive mode is on
                if (isInteractive) {
                    enableScrolling();
                }
            }, 100);
        }

        function enableScrolling() {
            scrollableElements.forEach(element => {
                if (element) {
                    // Enable mouse/trackpad scrolling with smooth behavior
                    element.style.scrollBehavior = 'smooth';
                    
                    // Add mouse enter handler to ensure focus for scrolling
                    element.addEventListener('mouseenter', handleMouseEnter, { passive: true });
                    element.addEventListener('mouseleave', handleMouseLeave, { passive: true });
                    
                    // Add wheel event for enhanced scrolling
                    element.addEventListener('wheel', handleWheelScroll, { passive: false });
                    
                }
            });
        }

        function disableScrolling() {
            scrollableElements.forEach(element => {
                if (element) {
                    element.removeEventListener('mouseenter', handleMouseEnter);
                    element.removeEventListener('mouseleave', handleMouseLeave);
                    element.removeEventListener('wheel', handleWheelScroll);
                }
            });
        }

        function handleMouseEnter(e) {
            // Focus the element for keyboard scrolling and ensure it's ready for mouse scrolling
            e.target.focus({ preventScroll: true });
            e.target.style.cursor = 'grab';
        }

        function handleMouseLeave(e) {
            e.target.style.cursor = 'default';
        }

        function handleWheelScroll(e) {
            // Allow natural scrolling behavior
            // Don't prevent default to maintain smooth native scrolling
            console.log('Wheel scroll detected on element');
        }

        // Fallback: if the model returned brace-style code collapsed onto one or
        // very few lines, reformat it with real newlines + indentation so it is readable.
        function reformatCollapsedCode(code, language) {
            if (!code) return code;
            const braceLangs = ['cpp', 'c', 'java', 'javascript', 'js', 'typescript', 'ts', 'csharp', 'cs', 'go', 'rust', 'php', 'kotlin', 'scala', 'swift', 'text', ''];
            const lang = (language || '').toLowerCase();
            if (braceLangs.indexOf(lang) === -1) return code;

            // Strip a stray leading language token / backticks the model may have left inside the block
            code = code.replace(/^\s*`+/, '').replace(/`+\s*$/, '');
            code = code.replace(/^\s*(cpp|c\+\+|java|javascript|js|typescript|ts|python|py|c|csharp|cs|go|rust|rs|php|kotlin|swift)\b[ \t]*/i, '');

            const lines = code.split('\n');
            const nonBlank = lines.filter(l => l.trim().length > 0);
            const braceCount = (code.match(/[{}]/g) || []).length;
            const semiCount = (code.match(/;/g) || []).length;
            const looksCollapsed =
                code.indexOf('{') !== -1 &&
                code.indexOf(';') !== -1 &&
                (nonBlank.length <= 4 ||
                 nonBlank.length < braceCount + semiCount - 2 ||
                 nonBlank.some(l => l.length > 120 && (l.match(/;/g) || []).length >= 2));
            if (!looksCollapsed) return code;

            let src = code.replace(/\r/g, '').replace(/\n/g, ' ').replace(/\s+/g, ' ').trim();

            let out = '';
            let indent = 0;
            let inStr = null;
            const pad = () => '    '.repeat(Math.max(indent, 0));

            for (let i = 0; i < src.length; i++) {
                const ch = src[i];
                const prev = src[i - 1];

                if (inStr) {
                    out += ch;
                    if (ch === inStr && prev !== '\\') inStr = null;
                    continue;
                }
                if (ch === '"' || ch === "'" || ch === '`') {
                    inStr = ch;
                    out += ch;
                    continue;
                }

                if (ch === '{') {
                    out = out.replace(/[ \t]+$/, '') + ' {\n';
                    indent++;
                    out += pad();
                    while (src[i + 1] === ' ') i++;
                } else if (ch === '}') {
                    out = out.replace(/[ \t]+$/, '').replace(/\n[ \t]*$/, '\n');
                    indent--;
                    out = out.replace(/\n?$/, '\n') + pad() + '}';
                    if (src[i + 1] === ';') { out += ';'; i++; }
                    out += '\n' + pad();
                    while (src[i + 1] === ' ') i++;
                } else if (ch === ';') {
                    // not inside for(;;)
                    let depth = 0;
                    for (let j = out.length - 1; j >= 0; j--) {
                        const c = out[j];
                        if (c === ')') depth++;
                        else if (c === '(') { depth--; if (depth < 0) break; }
                        else if (c === '\n') break;
                    }
                    if (depth < 0) {
                        out += ';';
                    } else {
                        out = out.replace(/[ \t]+$/, '') + ';\n' + pad();
                        while (src[i + 1] === ' ') i++;
                    }
                } else {
                    out += ch;
                }
            }

            out = out.split('\n').map(l => l.replace(/\s+$/, '')).join('\n').replace(/\n{3,}/g, '\n\n').trim();
            return out;
        }

        const KNOWN_LANGS = ['cpp','c','java','javascript','js','typescript','ts','python','py','csharp','cs','go','rust','rs','php','kotlin','kt','scala','swift','ruby','rb','text'];

        // Deliberately strict: a bare ANSWER MODE reply ("Encapsulation binds data
        // and methods within a class") must NOT be mistaken for source code.
        function looksLikeCode(s) {
            if (!s) return false;
            const t = s.trim();
            if (t.indexOf('{') !== -1 && t.indexOf(';') !== -1) return true;          // brace languages
            if (/^#include\b|^\s*(public\s+)?class\s+\w+\s*[:{]|^\s*def\s+\w+\s*\(/m.test(t)) return true;
            if (/\bdef\s+\w+\s*\([^)]*\)\s*:/.test(t)) return true;                    // python function
            if (/\b(vector|unordered_map|priority_queue)\s*</.test(t)) return true;    // c++ containers
            if (/^\s*(for|while|if)\s*\(.*\)\s*[:{]/m.test(t)) return true;            // control flow with body
            return false;
        }

        // Guess a language when the model gave no usable fence tag.
        function guessLanguage(code) {
            const t = code || '';
            if (/#include\b|\bvector<|\bstd::|\bcout\b|\bnullptr\b/.test(t)) return 'cpp';
            if (/\bdef\s+\w+\s*\(.*\)\s*:|\bself\b|\bprint\(/.test(t) && t.indexOf('{') === -1) return 'python';
            if (/\bpublic\s+(static\s+)?(class|void|int)\b|\bSystem\.out\b/.test(t)) return 'java';
            if (/\b(const|let|=>|function)\b/.test(t) && t.indexOf('#include') === -1) return 'javascript';
            return 'cpp';
        }

        function extractCodeBlocks(text) {
            const blocks = [];
            if (!text) return blocks;

            // 1) Well-formed fences: ```lang\n ... ```   (also ~~~)
            const strict = /(```|~~~)([^\n]*)\n([\s\S]*?)\1/g;
            let m;
            while ((m = strict.exec(text)) !== null) {
                const langToken = ((m[2] || '').trim().split(/\s+/)[0] || 'text');
                blocks.push({ language: langToken, code: reformatCollapsedCode(m[3], langToken), fullMatch: m[0] });
            }
            if (blocks.length) return blocks;

            // 2) Malformed fence: model wrote  ```cpp class Solution { ... } ```  with no newline
            //    or a stray leading backtick, or missing closing fence.
            const loose = /`{1,3}\s*([A-Za-z0-9+#]*)\s*([\s\S]*?)`{1,3}\s*$/;
            const lm = text.match(loose);
            if (lm && looksLikeCode(lm[2])) {
                let lang = (lm[1] || '').toLowerCase();
                if (KNOWN_LANGS.indexOf(lang) === -1) lang = guessLanguage(lm[2]);
                return [{ language: lang, code: reformatCollapsedCode(lm[2].trim(), lang), fullMatch: text }];
            }

            // 3) No backticks at all but the whole response is obviously source code
            const stripped = text.replace(/^`+|`+$/g, '').trim();
            if (looksLikeCode(stripped)) {
                const first = stripped.split(/\s+/)[0].toLowerCase();
                const lang = KNOWN_LANGS.indexOf(first) !== -1 ? first : guessLanguage(stripped);
                return [{ language: lang, code: reformatCollapsedCode(stripped, lang), fullMatch: text }];
            }

            return blocks;
        }

        function attachCopy(btn, text) {
            btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                try {
                    let ok = false;
                    if (window.electronAPI && typeof window.electronAPI.copyToClipboard === 'function') {
                        ok = await window.electronAPI.copyToClipboard(text);
                    }
                    if (!ok) {
                        if (navigator.clipboard && navigator.clipboard.writeText) {
                            await navigator.clipboard.writeText(text);
                            ok = true;
                        } else {
                            const ta = document.createElement('textarea');
                            ta.value = text;
                            document.body.appendChild(ta);
                            ta.select();
                            document.execCommand('copy');
                            ta.remove();
                            ok = true;
                        }
                    }
                    if (ok) {
                        btn.classList.add('copied');
                        const original = btn.textContent;
                        btn.textContent = 'Copied';
                        setTimeout(() => { btn.classList.remove('copied'); btn.textContent = original || 'Copy'; }, 1200);
                    }
                } catch (err) { console.warn('Copy failed', err); }
            })
        }

        function renderCopyButtonsInFullMarkdown(container) {
            // Add copy buttons to all code blocks in full markdown view
            const pres = container.querySelectorAll('pre');
            pres.forEach(pre => {
                // Avoid duplicate buttons
                if (pre.querySelector('.copy-btn')) return;
                const code = pre.querySelector('code');
                const text = code ? code.textContent : pre.textContent;
                const btn = document.createElement('button');
                btn.className = 'copy-btn';
                btn.textContent = 'Copy';
                attachCopy(btn, text || '');
                pre.style.position = 'relative';
                pre.appendChild(btn);
            });
        }

        function displaySplitLayout(response, codeBlocks) {
            // Show split layout, hide full layout
            document.getElementById('split-layout').classList.remove('hidden');
            document.getElementById('full-content').classList.add('hidden');

            // Remove code blocks from text content
            let textContent = response;
            codeBlocks.forEach(block => {
                textContent = textContent.replace(block.fullMatch, '');
            });

            // Clean up text content
            textContent = textContent.replace(/\n\s*\n\s*\n/g, '\n\n').trim();

            // Render text content
            const textHtml = renderMarkdown(textContent);
            document.getElementById('text-content').innerHTML = textHtml;
            if (window.renderMathInElement) window.renderMathInElement(document.getElementById('text-content'));

            // Render code blocks
            const codeContainer = document.getElementById('code-content');
            codeContainer.innerHTML = '';

            if (codeBlocks.length === 0) {
                codeContainer.innerHTML = '<div class="no-code">No code examples found</div>';
            } else {
                codeBlocks.forEach((block, index) => {
                    const codeBlock = document.createElement('div');
                    codeBlock.className = 'code-block';
                    codeBlock.innerHTML = `
                        <div class="code-header">${block.language.toUpperCase()}</div>
                        <div class="code-content">
                            <pre><code class="language-${block.language}">${escapeHtml(block.code)}</code></pre>
                        </div>
                    `;
                    const pre = codeBlock.querySelector('pre');
                    pre.style.position = 'relative';
                    const btn = document.createElement('button');
                    btn.className = 'copy-btn';
                    btn.textContent = 'Copy';
                    attachCopy(btn, block.code || '');
                    pre.appendChild(btn);

                    codeContainer.appendChild(codeBlock);
                });
            }

            // Highlight code if Prism is available
            if (typeof Prism !== 'undefined') {
                Prism.highlightAll();
            }
        }

        function displayFullLayout(response) {
            // Show full layout, hide split layout
            document.getElementById('split-layout').classList.add('hidden');
            document.getElementById('full-content').classList.remove('hidden');

            // Render full markdown
            const html = renderMarkdown(response);
            const full = document.getElementById('full-markdown');
            full.innerHTML = html;
            if (window.renderMathInElement) window.renderMathInElement(full);

            // Highlight any code if Prism is available
            if (typeof Prism !== 'undefined') {
                Prism.highlightAll();
            }

            // Add copy buttons to code blocks in full view
            const pres = full.querySelectorAll('pre');
            pres.forEach(pre => {
                if (pre.querySelector('.copy-btn')) return;
                const code = pre.querySelector('code');
                const text = code ? code.textContent : pre.textContent;
                const btn = document.createElement('button');
                btn.className = 'copy-btn';
                btn.textContent = 'Copy';
                attachCopy(btn, text || '');
                pre.style.position = 'relative';
                pre.appendChild(btn);
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }


        // Handle window focus
        window.addEventListener('focus', () => {
            console.log('LLM Response window focused');
        });

        // Handle window close
        window.addEventListener('beforeunload', () => {
            console.log('LLM Response window closing');
        });

        // Add keyboard scrolling support for when interactive
        document.addEventListener('keydown', (e) => {
            if (!isInteractive) return;
            
            const activeElement = document.activeElement;
            let targetElement = null;
            
            // Find the currently focused scrollable element
            for (let element of scrollableElements) {
                if (element === activeElement || element.contains(activeElement)) {
                    targetElement = element;
                    break;
                }
            }
            
            // Default to first scrollable element if none focused
            if (!targetElement && scrollableElements.length > 0) {
                targetElement = scrollableElements[0];
            }
            
            if (!targetElement) return;
            
            const scrollAmount = 50; // Pixels to scroll
            
            switch(e.key) {
                case 'ArrowUp':
                    e.preventDefault();
                    targetElement.scrollBy({ top: -scrollAmount, behavior: 'smooth' });
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    targetElement.scrollBy({ top: scrollAmount, behavior: 'smooth' });
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    targetElement.scrollBy({ left: -scrollAmount, behavior: 'smooth' });
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    targetElement.scrollBy({ left: scrollAmount, behavior: 'smooth' });
                    break;
                case 'PageUp':
                    e.preventDefault();
                    targetElement.scrollBy({ top: -targetElement.clientHeight * 0.8, behavior: 'smooth' });
                    break;
                case 'PageDown':
                    e.preventDefault();
                    targetElement.scrollBy({ top: targetElement.clientHeight * 0.8, behavior: 'smooth' });
                    break;
                case 'Home':
                    e.preventDefault();
                    targetElement.scrollTo({ top: 0, behavior: 'smooth' });
                    break;
                case 'End':
                    e.preventDefault();
                    targetElement.scrollTo({ top: targetElement.scrollHeight, behavior: 'smooth' });
                    break;
            }
        });

        // Add verification function to ensure content is properly displayed
        function verifyDisplayState() {
            const loadingElement = document.getElementById('loading');
            const responseElement = document.getElementById('response-content');
            
            const isLoadingHidden = loadingElement ? loadingElement.classList.contains('hidden') : true;
            const isContentVisible = responseElement ? !responseElement.classList.contains('hidden') : false;
            
            console.log('Display state verification:', {
                loadingHidden: isLoadingHidden,
                contentVisible: isContentVisible,
                windowVisible: !document.hidden
            });
            
            if (!isLoadingHidden || !isContentVisible) {
                console.warn('Display state inconsistent - forcing correction');
                if (loadingElement) {
                    loadingElement.classList.add('hidden');
                    loadingElement.style.display = 'none';
                }
                if (responseElement) {
                    responseElement.classList.remove('hidden');
                }
            }
        }

        // Add global debugging function
        window.debugLLMWindow = function() {
            console.log('=== LLM Window Debug Info ===');
            console.log('Current layout:', currentLayout);
            console.log('Has code:', hasCode);
            console.log('Is interactive:', isInteractive);
            console.log('Scrollable elements:', scrollableElements.length);
            
            const loadingElement = document.getElementById('loading');
            const responseElement = document.getElementById('response-content');
        };

        // Close button handler
        (function(){
            const btn = document.getElementById('close-window-btn');
            if (btn) {
                btn.addEventListener('click', () => {
                    try {
                        if (window.electronAPI && window.electronAPI.closeWindow) {
                            window.electronAPI.closeWindow();
                        } else if (window.api && window.api.send) {
                            window.api.send('quit-app');
                        } else {
                            window.close();
                        }
                    } catch (e) {
                        try { window.close(); } catch (_) {}
                    }
                });
            }
        })();
    </script>
